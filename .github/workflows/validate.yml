name: Validate configs

on:
  push:
  pull_request:

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["andy@x1", "andy@coolermaster"]
    name: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate
        run: nix build --dry-run .#homeConfigurations."${{ matrix.host }}".activationPackage

  validate-darwin:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        host: [ambp, amba]
    name: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate
        run: nix build --dry-run .#darwinConfigurations.${{ matrix.host }}.system
