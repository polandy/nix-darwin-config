# hyprlock configuration
# See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# Catppuccin Macchiato — matches waybar/dunst

$base     = rgb(24273a)
$surface1 = rgb(494d64)
$text     = rgb(cad3f5)
$subtext0 = rgb(a5adcb)
$blue     = rgb(8aadf4)
$mauve    = rgb(c6a0f6)
$yellow   = rgb(eed49f)
$red      = rgb(ed8796)
$font     = JetBrainsMono Nerd Font

general {
    grace = 5
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    brightness = 0.5
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = $font Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $subtext0
    font_size = 20
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $blue $mauve 45deg
    inner_color = rgba(24273ae6)
    font_color = $text
    font_family = $font
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb"><i>Password</i></span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
